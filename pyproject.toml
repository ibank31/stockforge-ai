[project]
name = "stockforge-ai"
version = "0.1.0.dev1"
description = "Open-source, Android-first digital asset production automation platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.16,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[project.scripts]
stockforge = "stockforge.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockforge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

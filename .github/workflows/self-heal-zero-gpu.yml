name: Self Heal ZeroGPU Contract

on:
  push:
    branches: [main]
    paths:
      - ".github/zero-gpu-contract-fix.txt"
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair exact remote API contract
        run: |
          python - <<'PY'
          from pathlib import Path

          pipeline = Path("deploy/pipeline-worker/src/index.js")
          text = pipeline.read_text()
          old = 'const remote = await runRemote(this.env, step, "upscale_remote", [sourceUrl, `${jobId}-upscale`, 1, jobId], UPSCALE_POLL_ATTEMPTS, "upscale", jobId);'
          new = 'const remote = await runRemote(this.env, step, "upscale_remote", [sourceUrl, `${jobId}-upscale`, 4], UPSCALE_POLL_ATTEMPTS, "upscale", jobId);'
          assert text.count(old) == 1, "expected exactly one production upscale call contract"
          pipeline.write_text(text.replace(old, new))

          smoke = Path(".github/workflows/deploy-zerogpu.yml")
          text = smoke.read_text()
          old = 'client.predict(source_path.as_posix(), "zero-gpu-smoke-final", api_name="/upscale")'
          new = 'client.predict(source_path.as_posix(), "zero-gpu-smoke-final", 4, api_name="/upscale_remote")'
          assert text.count(old) == 1, "expected exactly one stale ZeroGPU smoke endpoint"
          smoke.write_text(text.replace(old, new))
          PY

      - name: Validate syntax
        run: |
          node --check deploy/pipeline-worker/src/index.js
          python -m py_compile deploy/zerogpu/app.py deploy/zerogpu/upscale.py deploy/zerogpu/remote_api.py

      - name: Commit repaired contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/pipeline-worker/src/index.js .github/workflows/deploy-zerogpu.yml
          git commit -m "fix: align ZeroGPU upscale remote API contract"
          git rm .github/zero-gpu-contract-fix.txt .github/workflows/self-heal-zero-gpu.yml
          git commit -m "chore: remove one-shot ZeroGPU repair workflow"
          git push

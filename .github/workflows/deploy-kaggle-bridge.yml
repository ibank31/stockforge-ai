name: Deploy StockForge Kaggle Upscale Bridge

on:
  push:
    branches: [main]
    paths:
      - "deploy/kaggle-bridge/**"
      - ".github/workflows/deploy-kaggle-bridge.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_HUB_TOKEN || secrets.HUGGINGFACE_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      HF_SPACE: ibank31/stockforge-kaggle-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Hugging Face credential
        id: credential
        run: |
          if [ -n "$HF_TOKEN" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else echo "configured=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install Hugging Face Hub
        if: steps.credential.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check --no-cache-dir "huggingface_hub>=0.30,<1.0"
      - name: Create/update bridge Space and configure secret
        if: steps.credential.outputs.configured == 'true'
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = os.environ["HF_SPACE"]
          api.create_repo(repo_id=repo_id, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(folder_path="deploy/kaggle-bridge", repo_id=repo_id, repo_type="space", commit_message="deploy StockForge Kaggle upscale bridge")
          token = os.environ.get("KAGGLE_API_TOKEN", "").strip()
          if token:
              api.add_space_secret(repo_id=repo_id, key="KAGGLE_API_TOKEN", value=token)
              print("Kaggle bridge secret synchronized")
          else:
              print("KAGGLE_API_TOKEN GitHub secret is not configured; bridge will deploy but remain GPU-job disabled until the Space secret is added.")
          print(f"Bridge deployed: https://huggingface.co/spaces/{repo_id}")
          PY

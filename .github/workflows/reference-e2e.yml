name: Reference Intelligence Production E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  reference-e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'E2E_REFERENCE_PROD'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Production reference intelligence E2E
        env:
          BASE_URL: https://stockforge-ai.pages.dev
        run: |
          set -euo pipefail
          python - <<'PY'
          import struct, zlib
          from pathlib import Path
          width = height = 512
          rows = []
          for y in range(height):
              row = bytearray([0])
              for x in range(width):
                  r,g,b = (245,245,240)
                  if 150 <= x <= 360 and 100 <= y <= 410:
                      r,g,b = (35,90,55)
                  if 190 <= x <= 320 and 70 <= y <= 140:
                      r,g,b = (55,55,55)
                  row.extend((r,g,b))
              rows.append(bytes(row))
          raw=b''.join(rows)
          def chunk(k,d): return struct.pack('>I',len(d))+k+d+struct.pack('>I',zlib.crc32(k+d)&0xffffffff)
          png=bytearray(b'\x89PNG\r\n\x1a\n')
          png+=chunk(b'IHDR',struct.pack('>IIBBBBB',width,height,8,2,0,0,0))
          png+=chunk(b'IDAT',zlib.compress(raw,9))
          png+=chunk(b'IEND',b'')
          Path('/tmp/reference.png').write_bytes(png)
          PY
          echo '=== PROD REFERENCE INTELLIGENCE ==='
          HTTP_CODE=$(curl -sS -D /tmp/headers -o /tmp/reference.json -w '%{http_code}' -X POST -F 'file=@/tmp/reference.png;type=image/png' "$BASE_URL/api/reference-intelligence")
          echo "HTTP=$HTTP_CODE"
          cat /tmp/headers
          cat /tmp/reference.json
          test "$HTTP_CODE" = "200"
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/reference.json','utf8'));
          if(!x.reference_id || !x.workflow_id) throw Error('missing reference/workflow id: '+JSON.stringify(x));
          if(x.decision!=='REVIEW_REQUIRED') throw Error('unexpected decision: '+JSON.stringify(x));
          const loc=x.profile?.asset_localization;
          if(!loc?.primary_asset?.label || !loc?.primary_asset?.bbox_normalized) throw Error('localization missing valid primary asset: '+JSON.stringify(loc));
          if(!(loc.primary_asset.confidence>=0.5)) throw Error('localization confidence too low: '+JSON.stringify(loc));
          const opp=x.profile?.asset_opportunities;
          if(!Array.isArray(opp) || opp.length!==5) throw Error('expected exactly 5 opportunities: '+JSON.stringify(opp));
          console.log(JSON.stringify({ok:true,reference_id:x.reference_id,workflow_id:x.workflow_id,primary:loc.primary_asset,opportunities:opp.length},null,2));
          NODE
          echo '=== REFERENCE E2E PASSED ==='
          # E2E_REFERENCE_PROD trigger checkpoint

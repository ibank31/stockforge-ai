name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.11
      - run: uv sync --extra dev --extra image --extra web
      - run: uv run pytest -q
      - run: uv run stockforge version
      - name: Validate ZeroGPU Python sources
        run: python -m py_compile deploy/zerogpu/upscale.py deploy/zerogpu/remote_api.py
      - name: Validate JavaScript sources
        shell: bash
        run: |
          set -euo pipefail
          node --check deploy/pipeline-worker/src/index.js
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find frontend/functions -type f -name '*.js' -print0)
      - name: Validate deployment configs exist
        run: |
          test -f frontend/wrangler.toml
          test -f frontend/migrations/0001_stockforge.sql
          test -f deploy/pipeline-worker/wrangler.toml
          test -f deploy/pipeline-worker/src/index.js

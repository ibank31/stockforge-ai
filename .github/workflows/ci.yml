name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.11
      - run: uv sync --extra dev --extra image --extra web
      - run: uv run pytest -q
      - run: uv run stockforge version
      - name: Validate ZeroGPU Python sources
        run: python -m py_compile deploy/zerogpu/upscale.py deploy/zerogpu/remote_api.py
      - name: Validate JavaScript sources
        shell: bash
        run: |
          set -euo pipefail
          node --check deploy/pipeline-worker/src/index.js
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find frontend/functions -type f -name '*.js' -print0)
          node --check frontend/lib/reference-forensics.js
      - name: Validate reference forensics contract
        run: node --test tests/test_reference_forensics.mjs
      - name: Validate deployment configs exist
        run: |
          test -f frontend/wrangler.toml
          test -f frontend/migrations/0001_stockforge.sql
          test -f frontend/migrations/0002_pipeline_resilience.sql
          test -f deploy/pipeline-worker/wrangler.toml
          test -f deploy/pipeline-worker/src/index.js
      - name: Validate D1 migrations
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          con = sqlite3.connect(':memory:')
          for name in ('0001_stockforge.sql', '0002_pipeline_resilience.sql'):
              con.executescript(Path('frontend/migrations', name).read_text())
          columns = {row[1] for row in con.execute('PRAGMA table_info(jobs_sf)')}
          required = {'generation_attempts','upscale_attempts','failed_mode','failure_code','retryable','last_workflow_id','last_workflow_created_at'}
          missing = required - columns
          if missing:
              raise SystemExit(f'missing jobs_sf columns: {sorted(missing)}')
          con.execute("INSERT INTO job_events_sf(job_id,event_type,stage,status,message,created_at) VALUES('test','ci','TEST','ok','migration ok','2026-09-15T00:00:00Z')")
          assert con.execute("SELECT count(*) FROM job_events_sf WHERE job_id='test'").fetchone()[0] == 1
          print('D1 migrations apply cleanly')
          PY
      - name: Validate pipeline contracts
        run: |
          grep -q 'ready_upscale' deploy/pipeline-worker/src/index.js
          grep -q 'mode === "upscale"' deploy/pipeline-worker/src/index.js
          grep -q 'retryable' frontend/functions/api/jobs/'[jobId]'/retry.js
          grep -q 'job_events_sf' frontend/functions/api/jobs/'[jobId]'/events.js
          grep -q 'READY_UPLOAD_ADOBE' frontend/functions/api/jobs/'[jobId]'/release.js
          grep -q 'category' frontend/functions/api/jobs/'[jobId]'/release.js

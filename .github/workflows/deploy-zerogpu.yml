name: Deploy StockForge ZeroGPU

on:
  push:
    branches: [main]
    paths:
      - "deploy/zerogpu/**"
      - ".github/workflows/deploy-zerogpu.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_HUB_TOKEN || secrets.HUGGINGFACE_TOKEN }}
      HF_SPACE: ibank31/stockforge-zerogpu
      SPACE_URL: https://ibank31-stockforge-zerogpu.hf.space
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check credential
        id: credential
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "HF deployment credential is missing; Space sync will be skipped."
          fi
      - name: Install Hugging Face Hub
        if: steps.credential.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check --no-cache-dir "huggingface_hub>=0.30,<1.0"
      - name: Sync ZeroGPU Space
        id: sync
        if: steps.credential.outputs.configured == 'true'
        run: |
          python - <<'PY'
          import os
          import hashlib
          import tempfile
          from pathlib import Path
          from huggingface_hub import CommitOperationAdd, HfApi, hf_hub_download
          api = HfApi(token=os.environ["HF_TOKEN"])
          root = Path("deploy/zerogpu")
          files = [path for path in sorted(root.rglob("*")) if path.is_file() and "__pycache__" not in path.parts]
          operations = [
              CommitOperationAdd(
                  path_in_repo=str(path.relative_to(root)),
                  path_or_fileobj=str(path),
              )
              for path in files
          ]
          api.create_commit(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              operations=operations,
              commit_message="sync ZeroGPU generation and upscale worker from main",
          )
          with tempfile.TemporaryDirectory() as temp_dir:
              for name in ("app.py", "README.md"):
                  remote = Path(hf_hub_download(
                      repo_id=os.environ["HF_SPACE"],
                      filename=name,
                      repo_type="space",
                      revision="main",
                      token=os.environ["HF_TOKEN"],
                      local_dir=temp_dir,
                  ))
                  local_hash = hashlib.sha256(Path("deploy/zerogpu", name).read_bytes()).hexdigest()
                  remote_hash = hashlib.sha256(remote.read_bytes()).hexdigest()
                  print(f"{name}: local_sha256={local_hash} remote_sha256={remote_hash}")
                  if local_hash != remote_hash:
                      raise SystemExit(f"ZeroGPU source verification failed for {name}")
          print(f"ZeroGPU Space synced and verified ({len(files)} files)")
          PY
      - name: Live ZeroGPU production smoke
        id: smoke
        if: steps.credential.outputs.configured == 'true' && contains(github.event.head_commit.message, 'ZERO_GPU_LIVE_SMOKE')
        timeout-minutes: 12
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "gradio_client>=1.9,<2.0" pillow
          python - <<'PY'
          import os, time
          from pathlib import Path
          from gradio_client import Client
          from PIL import Image

          space = os.environ["SPACE_URL"]
          client = None
          last = None
          for attempt in range(1, 25):
              try:
                  client = Client(space, verbose=False)
                  print(f"Space client ready on attempt {attempt}")
                  break
              except Exception as exc:
                  last = exc
                  print(f"Space not ready yet ({attempt}/24): {type(exc).__name__}: {exc}")
                  time.sleep(15)
          if client is None:
              raise RuntimeError(f"ZeroGPU Space did not become ready: {last}")

          prompt = (
              "premium commercial stock asset photograph of one original ceramic travel mug, "
              "clean studio lighting, realistic materials, simple isolated composition, "
              "no brand, no logo, no text, no watermark, visually polished for a stock marketplace"
          )
          generated = client.predict(prompt, 1328, 1328, 4, 123456, False, "zero-gpu-smoke", api_name="/generate_remote")
          print("GENERATION RESULT:", generated)
          source = generated[0]
          source_path = Path(str(source))
          if not source_path.exists():
              raise RuntimeError(f"Generation output file missing: {source_path}")
          with Image.open(source_path) as im:
              print("RAW IMAGE:", im.size, im.mode)
              if im.width < 1200 or im.height < 1200:
                  raise RuntimeError(f"Unexpected raw image dimensions: {im.size}")

          finalized = client.predict(source_path.as_posix(), "zero-gpu-smoke-final", api_name="/upscale_remote")
          print("UPSCALE RESULT:", finalized)
          final_path = Path(str(finalized[0]))
          if not final_path.exists():
              raise RuntimeError(f"Final output file missing: {final_path}")
          with Image.open(final_path) as im:
              print("FINAL IMAGE:", im.size, im.mode, im.format)
              if im.width < 4000 or im.height < 4000:
                  raise RuntimeError(f"Finalizer did not produce >=4K output: {im.size}")
              if im.format != "JPEG":
                  raise RuntimeError(f"Finalizer did not produce JPEG: {im.format}")
          print("ZERO_GPU_LIVE_SMOKE PASSED")
          PY
      - name: Record deployment status in repository
        if: always()
        env:
          CREDENTIAL: ${{ steps.credential.outputs.configured || 'false' }}
          SYNC_OUTCOME: ${{ steps.sync.outcome || 'skipped' }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome || 'skipped' }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          status = {
              "commit": os.environ["SHA"],
              "credential_configured": os.environ["CREDENTIAL"],
              "space_sync": os.environ["SYNC_OUTCOME"],
              "live_smoke": os.environ["SMOKE_OUTCOME"],
          }
          Path(".github/stockforge-zero-gpu-status.json").write_text(json.dumps(status, indent=2) + "\n")
          print(json.dumps(status, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/stockforge-zero-gpu-status.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record ZeroGPU deployment status [skip ci]"
          git push

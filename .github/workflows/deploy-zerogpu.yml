name: Deploy StockForge ZeroGPU

on:
  push:
    branches: [main]
    paths:
      - "deploy/zerogpu/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_HUB_TOKEN || secrets.HUGGINGFACE_TOKEN }}
      HF_SPACE: ibank31/stockforge-zerogpu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check credential
        id: credential
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "HF deployment credential is missing; skipping Space sync."
          fi
      - name: Install Hugging Face Hub
        if: steps.credential.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check --no-cache-dir "huggingface_hub>=0.30,<1.0"
      - name: Sync ZeroGPU Space
        if: steps.credential.outputs.configured == 'true'
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path="deploy/zerogpu",
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              commit_message="sync ZeroGPU generation and upscale worker from main",
          )
          print("ZeroGPU Space synced")
          PY

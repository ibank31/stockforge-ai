orchestrator)\n            if verification is not None:\n                result["post_generation_verification"] = verification\n            completed = self.job_manager.complete(job.id, result)\n            if workflow_id:\n                if verification and verification.get("decision") == "BLOCK":\n                    control.event(workflow_id, stage="HUMAN_REVIEW", status="blocked", message="Similarity gate blocked the candidate.", job_id=job.id, provider_id=provider_id, provider_job_id=provider_job_id, details=verification)\n                else:\n                    control.event(workflow_id, stage="HUMAN_REVIEW", status="human_review", message="Generation completed; human review is required.", job_id=job.id, provider_id=provider_id, provider_job_id=provider_job_id, details=verification or {})\n            return WorkerResult(completed.id, completed.status, result)\n        except Exception as exc:\n            if heartbeat:\n                heartbeat.__exit__(None, None, None)\n            error = str(exc) or exc.__class__.__name__\n            failed = self.job_manager.fail(job.id, error)\n            if workflow_id:\n                control.event(workflow_id, stage="GENERATING", status="failed" if failed.status == "failed" else "active", message=error, job_id=job.id, details={"retry": failed.status == "queued"})\n            return WorkerResult(failed.id, failed.status, {"error": error, "retry": failed.status == "queued"})\n\n'''

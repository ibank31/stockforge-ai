name: Implement durable job control center

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Apply implementation
        run: python scripts/apply_job_control.py
      - name: Commit canonical changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/apply_job_control.py .github/workflows/implement_job_control_center.yml
          git add src/stockforge/workflow_control.py src/stockforge/web_app.py src/stockforge/job_worker.py src/stockforge/web_runner.py tests/test_workflow_control.py
          git commit -m 'feat: add durable end-to-end job control center'
          git push origin HEAD:main

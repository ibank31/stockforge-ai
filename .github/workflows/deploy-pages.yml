name: Deploy StockForge Cloud control plane

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "deploy/pipeline-worker/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      PAGES_PROJECT: stockforge-ai
      PIPELINE_WORKER: stockforge-pipeline
      D1_NAME: stockforge
      R2_NAME: stockforge-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check deployment credentials
        id: credential
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are missing; skipping remote deployment."
          fi
      - name: Install Wrangler
        if: steps.credential.outputs.configured == 'true'
        run: npm install --global wrangler@4
      - name: Ensure Pages project exists
        if: steps.credential.outputs.configured == 'true'
        run: wrangler pages project create "$PAGES_PROJECT" --production-branch main || true
      - name: Ensure R2 bucket exists
        if: steps.credential.outputs.configured == 'true'
        run: wrangler r2 bucket create "$R2_NAME" || true
      - name: Ensure D1 database exists
        if: steps.credential.outputs.configured == 'true'
        run: |
          wrangler d1 create "$D1_NAME" > d1-create.txt 2>&1 || true
          D1_JSON=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")
          DB_ID=$(printf '%s' "$D1_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const x=(a.result||[]).find(r=>r.name===process.env.D1_NAME);if(!x||!x.uuid){process.exit(2)}console.log(x.uuid)})')
          echo "D1_ID=$DB_ID" >> "$GITHUB_ENV"
      - name: Render production configs
        if: steps.credential.outputs.configured == 'true'
        run: |
          test -n "$D1_ID"
          sed -i "s/REPLACED_BY_DEPLOY_WORKFLOW/$D1_ID/" frontend/wrangler.toml
          sed -i "s/REPLACED_BY_DEPLOY_WORKFLOW/$D1_ID/" deploy/pipeline-worker/wrangler.toml
      - name: Apply D1 schema
        if: steps.credential.outputs.configured == 'true'
        run: wrangler d1 migrations apply "$D1_NAME" --remote --config frontend/wrangler.toml
      - name: Deploy durable pipeline Worker
        if: steps.credential.outputs.configured == 'true'
        run: wrangler deploy --config deploy/pipeline-worker/wrangler.toml
      - name: Deploy Pages front door
        if: steps.credential.outputs.configured == 'true'
        working-directory: frontend
        run: wrangler pages deploy . --project-name "$PAGES_PROJECT" --branch main
      - name: Smoke test page.dev
        if: steps.credential.outputs.configured == 'true'
        run: |
          BASE_URL="https://${PAGES_PROJECT}.pages.dev"
          HEADERS=$(curl -sS -D - -o health.json "$BASE_URL/api/health" || true)
          echo "$HEADERS"
          CONTENT_TYPE=$(printf '%s\n' "$HEADERS" | awk -F': ' 'tolower($1)=="content-type" {print tolower($2)}' | tail -n1 | tr -d '\r')
          case "$CONTENT_TYPE" in
            application/json*) ;;
            *) echo "Expected JSON from /api/health, got content-type: ${CONTENT_TYPE:-unknown}"; head -c 500 health.json || true; exit 1;;
          esac
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          if (body.status !== 'ok') {
            console.error(body);
            process.exit(1);
          }
          console.log(JSON.stringify(body, null, 2));
          NODE
          curl -fsS "$BASE_URL/" | grep -q "StockForge V2"
          echo "page.dev smoke test passed"

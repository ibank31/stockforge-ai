name: Deploy StockForge Cloud control plane

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "deploy/pipeline-worker/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      PAGES_PROJECT: stockforge-ai
      PIPELINE_WORKER: stockforge-pipeline
      D1_NAME: stockforge
      R2_NAME: stockforge-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check deployment credentials
        id: credential
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are missing; skipping remote deployment."
          fi
      - name: Validate runtime JavaScript
        run: |
          node --check deploy/pipeline-worker/src/index.js
          node --check 'frontend/functions/api/jobs/[jobId]/upscale.js'
          node --check 'frontend/functions/api/references/[referenceId]/generate.js'
          node --check frontend/functions/api/reference-intelligence.js
          node --check frontend/lib/reference-intelligence.js
      - name: Install Wrangler
        if: steps.credential.outputs.configured == 'true'
        run: npm install --global wrangler@4
      - name: Ensure Pages project exists
        if: steps.credential.outputs.configured == 'true'
        run: wrangler pages project create "$PAGES_PROJECT" --production-branch main || true
      - name: Ensure R2 bucket exists
        if: steps.credential.outputs.configured == 'true'
        run: wrangler r2 bucket create "$R2_NAME" || true
      - name: Ensure D1 database exists
        if: steps.credential.outputs.configured == 'true'
        run: |
          wrangler d1 create "$D1_NAME" > d1-create.txt 2>&1 || true
          D1_JSON=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")
          DB_ID=$(printf '%s' "$D1_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const x=(a.result||[]).find(r=>r.name===process.env.D1_NAME);if(!x||!x.uuid){process.exit(2)}console.log(x.uuid)})')
          echo "D1_ID=$DB_ID" >> "$GITHUB_ENV"
      - name: Render production configs
        if: steps.credential.outputs.configured == 'true'
        run: |
          test -n "$D1_ID"
          sed -i "s/REPLACED_BY_DEPLOY_WORKFLOW/$D1_ID/" frontend/wrangler.toml
          sed -i "s/REPLACED_BY_DEPLOY_WORKFLOW/$D1_ID/" deploy/pipeline-worker/wrangler.toml
      - name: Apply D1 schema
        if: steps.credential.outputs.configured == 'true'
        run: wrangler d1 migrations apply "$D1_NAME" --remote --config frontend/wrangler.toml
      - name: Deploy durable pipeline Worker
        if: steps.credential.outputs.configured == 'true'
        run: wrangler deploy --config deploy/pipeline-worker/wrangler.toml
      - name: Deploy Pages front door
        if: steps.credential.outputs.configured == 'true'
        working-directory: frontend
        run: wrangler pages deploy . --project-name "$PAGES_PROJECT" --branch main
      - name: Smoke test page.dev
        if: steps.credential.outputs.configured == 'true'
        run: |
          BASE_URL="https://${PAGES_PROJECT}.pages.dev"
          HEADERS=$(curl -sS -D - -o health.json "$BASE_URL/api/health" || true)
          echo "$HEADERS"
          CONTENT_TYPE=$(printf '%s\n' "$HEADERS" | awk -F': ' 'tolower($1)=="content-type" {print tolower($2)}' | tail -n1 | tr -d '\r')
          case "$CONTENT_TYPE" in
            application/json*) ;;
            *) echo "Expected JSON from /api/health, got content-type: ${CONTENT_TYPE:-unknown}"; head -c 500 health.json || true; exit 1;;
          esac
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          if (body.status !== 'ok') {
            console.error(body);
            process.exit(1);
          }
          console.log(JSON.stringify(body, null, 2));
          NODE
          curl -fsS "$BASE_URL/" | grep -q "StockForge V2"
          echo "page.dev smoke test passed"
      - name: One-time generation boundary E2E
        if: steps.credential.outputs.configured == 'true' && github.event_name == 'push' && github.event.head_commit.message == 'E2E_PROD'
        run: |
          set -euo pipefail
          BASE_URL="https://${PAGES_PROJECT}.pages.dev"
          python - <<'PY'
          import struct, zlib
          from pathlib import Path

          width = height = 256
          rows = []
          for y in range(height):
              row = bytearray([0])
              for x in range(width):
                  if y < 120:
                      base = (238, 232, 213)
                  else:
                      base = (176, 120, 70)
                  if 70 < x < 105 and 55 < y < 115:
                      base = (44, 67, 49)
                  if 155 < x < 210 and 145 < y < 205 and (x-182)**2 + (y-172)**2 < 850:
                      base = (38, 78, 125)
                  if 145 < x < 215 and 205 < y < 230:
                      base = (70, 52, 40)
                  if 20 < x < 120 and 150 < y < 205:
                      base = (245, 244, 238)
                  row.extend(base)
              rows.append(bytes(row))

          raw = b''.join(rows)
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)

          png = bytearray(b'\x89PNG\r\n\x1a\n')
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(raw, 9))
          png += chunk(b'IEND', b'')
          Path('/tmp/reference.png').write_bytes(png)
          PY
          HTTP_CODE=$(curl -sS -o reference.json -w '%{http_code}' -X POST -F 'file=@/tmp/reference.png;type=image/png' "$BASE_URL/api/reference-intelligence")
          echo "reference HTTP=$HTTP_CODE"
          cat reference.json
          test "$HTTP_CODE" = "200"
          node -e 'const x=require("./reference.json"); if(!x.reference_id) throw Error(JSON.stringify(x)); if(!x.workflow_id) throw Error(JSON.stringify(x)); if(!x.profile?.visual_summary) throw Error(JSON.stringify(x)); if(!Array.isArray(x.profile?.asset_opportunities) || x.profile.asset_opportunities.length!==5) throw Error(JSON.stringify(x)); if(x.profile.intelligence?.fallback_count!==0) throw Error(JSON.stringify(x)); console.log("reference intelligence passed", JSON.stringify({reference_id:x.reference_id,workflow_id:x.workflow_id,opportunities:x.profile.asset_opportunities.length})); require("fs").writeFileSync("ref.id",x.reference_id)'
          REF_ID=$(cat ref.id)
          cat > plan.json <<'JSON'
          {
            "opportunity_index": 0,
            "market_intent": "commercial website banner and presentation cover"
          }
          JSON
          PLAN_CODE=$(curl -sS -o plan-response.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data @plan.json "$BASE_URL/api/references/$REF_ID/plan")
          echo "plan HTTP=$PLAN_CODE"
          cat plan-response.json
          test "$PLAN_CODE" = "200"
          node -e 'const x=require("./plan-response.json"); if(x.decision!=="READY_TO_GENERATE" || !x.plan) throw Error(JSON.stringify(x)); console.log("plan=READY_TO_GENERATE")'
          GEN_CODE=$(curl -sS -o generate.json -w '%{http_code}' -X POST "$BASE_URL/api/references/$REF_ID/generate")
          echo "generate HTTP=$GEN_CODE"
          cat generate.json
          test "$GEN_CODE" = "200"
          node -e 'const x=require("./generate.json"); if(!x.job_id || !x.workflow_id) throw Error(JSON.stringify(x)); console.log("generation request accepted", JSON.stringify({job_id:x.job_id,workflow_id:x.workflow_id,status:x.status||null,stage:x.stage||null})); require("fs").writeFileSync("job.id",x.job_id)'
          JOB_ID=$(cat job.id)
          curl --fail-with-body -sS "$BASE_URL/api/jobs/$JOB_ID" > job.json
          node -e 'const x=require("./job.json"); if(!x.id || x.id!==process.env.JOB_ID) throw Error(JSON.stringify(x)); if(["failed","blocked","cancelled"].includes(x.status)) throw Error(JSON.stringify(x)); console.log("generation boundary passed", JSON.stringify({status:x.status,stage:x.stage}))'
          echo "REFERENCE INTELLIGENCE + PLAN + GENERATION E2E PASSED"

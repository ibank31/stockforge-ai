name: Deploy StockForge Cloud control plane

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "deploy/pipeline-worker/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      PAGES_PROJECT: stockforge-ai
      PIPELINE_WORKER: stockforge-pipeline
      D1_NAME: stockforge
      R2_NAME: stockforge-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check deployment credentials
        id: credential
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are missing; skipping remote deployment."
          fi
      - name: Validate runtime JavaScript
        run: |
          node --check deploy/pipeline-worker/src/index.js
          node --check 'frontend/functions/api/jobs/[jobId]/upscale.js'
          node --check 'frontend/functions/api/references/[referenceId]/generate.js'
      - name: Install Wrangler
        if: steps.credential.outputs.configured == 'true'
        run: npm install --global wrangler@4
      - name: Ensure Pages project exists
        if: steps.credential.outputs.configured == 'true'
        run: wrangler pages project create "$PAGES_PROJECT" --production-branch main || true
      - name: Ensure R2 bucket exists
        if: steps.credential.outputs.configured == 'true'
        run: wrangler r2 bucket create "$R2_NAME" || true
      - name: Ensure D1 database exists
        if: steps.credential.outputs.configured == 'true'
        run: |
          wrangler d1 create "$D1_NAME" > d1-create.txt 2>&1 || true
          D1_JSON=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")
          DB_ID=$(printf '%s' "$D1_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const x=(a.result||[]).find(r=>r.name===process.env.D1_NAME);if(!x||!x.uuid){process.exit(2)}console.log(x.uuid)})')
          echo "D1_ID=$DB_ID" >> "$GITHUB_ENV"
      - name: Render production configs
        if: steps.credential.outputs.configured == 'true'
        run: |
          test -n "$D1_ID"
          sed -i "s/REPLACED_BY_DEPLOY_WORKFLOW/$D1_ID/" frontend/wrangler.toml
          sed -i "s/REPLACED_BY_DEPLOY_WORKFLOW/$D1_ID/" deploy/pipeline-worker/wrangler.toml
      - name: Apply D1 schema
        if: steps.credential.outputs.configured == 'true'
        run: wrangler d1 migrations apply "$D1_NAME" --remote --config frontend/wrangler.toml
      - name: Deploy durable pipeline Worker
        if: steps.credential.outputs.configured == 'true'
        run: wrangler deploy --config deploy/pipeline-worker/wrangler.toml
      - name: Deploy Pages front door
        if: steps.credential.outputs.configured == 'true'
        working-directory: frontend
        run: wrangler pages deploy . --project-name "$PAGES_PROJECT" --branch main
      - name: Smoke test page.dev
        if: steps.credential.outputs.configured == 'true'
        run: |
          BASE_URL="https://${PAGES_PROJECT}.pages.dev"
          HEADERS=$(curl -sS -D - -o health.json "$BASE_URL/api/health" || true)
          echo "$HEADERS"
          CONTENT_TYPE=$(printf '%s\n' "$HEADERS" | awk -F': ' 'tolower($1)=="content-type" {print tolower($2)}' | tail -n1 | tr -d '\r')
          case "$CONTENT_TYPE" in
            application/json*) ;;
            *) echo "Expected JSON from /api/health, got content-type: ${CONTENT_TYPE:-unknown}"; head -c 500 health.json || true; exit 1;;
          esac
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          if (body.status !== 'ok') {
            console.error(body);
            process.exit(1);
          }
          console.log(JSON.stringify(body, null, 2));
          NODE
          curl -fsS "$BASE_URL/" | grep -q "StockForge V2"
          echo "page.dev smoke test passed"
      - name: One-time generation boundary E2E
        if: steps.credential.outputs.configured == 'true' && github.event_name == 'push' && github.event.head_commit.message == 'E2E_PROD'
        run: |
          set -euo pipefail
          BASE_URL="https://${PAGES_PROJECT}.pages.dev"
          python - <<'PY'
          import struct, zlib
          from pathlib import Path

          width = height = 64
          rows = []
          for y in range(height):
              row = bytearray([0])
              for x in range(width):
                  if x < width // 2 and y < height // 2:
                      rgb = (33, 58, 83)
                  elif x >= width // 2 and y < height // 2:
                      rgb = (238, 232, 213)
                  elif x < width // 2 and y >= height // 2:
                      rgb = (196, 125, 72)
                  else:
                      rgb = (62, 69, 77)
                  row.extend(rgb)
              rows.append(bytes(row))

          raw = b''.join(rows)
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)

          png = bytearray(b'\x89PNG\r\n\x1a\n')
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(raw, 9))
          png += chunk(b'IEND', b'')
          Path('/tmp/reference.png').write_bytes(png)
          PY
          HTTP_CODE=$(curl -sS -o reference.json -w '%{http_code}' -X POST -F 'file=@/tmp/reference.png;type=image/png' "$BASE_URL/api/references")
          echo "reference HTTP=$HTTP_CODE"
          cat reference.json
          test "$HTTP_CODE" = "200"
          node -e 'const x=require("./reference.json"); if(!x.reference_id) throw Error(JSON.stringify(x)); if(!x.workflow_id) throw Error(JSON.stringify(x)); if(!x.profile?.visual_summary) throw Error(JSON.stringify(x)); if(!Array.isArray(x.profile?.asset_opportunities) || x.profile.asset_opportunities.length!==5) throw Error(JSON.stringify(x)); console.log("reference intelligence passed", JSON.stringify({reference_id:x.reference_id,workflow_id:x.workflow_id,opportunities:x.profile.asset_opportunities.length})); require("fs").writeFileSync("ref.id",x.reference_id)'
          REF_ID=$(cat ref.id)
          cat > plan.json <<'JSON'
          {
            "market_intent": "commercial website banner and presentation cover",
            "change_subject": true,
            "change_composition": true,
            "change_viewpoint": true,
            "change_color_direction": true,
            "change_context": true,
            "change_use_case": true,
            "proposed_subject": "minimal ceramic coffee cup beside a closed notebook",
            "proposed_composition": "balanced tabletop arrangement with generous negative space on the left",
            "proposed_viewpoint": "slightly elevated three-quarter view",
            "proposed_color_direction": "warm ivory, muted terracotta and soft charcoal",
            "proposed_context": "calm modern workspace with subtle daylight",
            "proposed_use_case": "editorial productivity, business planning and website hero banner"
          }
          JSON
          curl --fail-with-body -sS -X POST -H 'content-type: application/json' --data @plan.json "$BASE_URL/api/references/$REF_ID/plan" > plan-response.json
          node -e 'const x=require("./plan-response.json"); if(x.decision!=="READY_TO_GENERATE" || !x.plan) throw Error(JSON.stringify(x)); console.log("plan=READY_TO_GENERATE")'
          curl --fail-with-body -sS -X POST "$BASE_URL/api/references/$REF_ID/generate" > generate.json
          node -e 'const x=require("./generate.json"); if(!x.job_id) throw Error(JSON.stringify(x)); console.log("job_id="+x.job_id); require("fs").writeFileSync("job.id",x.job_id)'
          JOB_ID=$(cat job.id)
          ready=false
          for i in $(seq 1 120); do
            sleep 10
            curl --fail-with-body -sS "$BASE_URL/api/jobs/$JOB_ID" > job.json
            STATE=$(node -e 'const x=require("./job.json"); console.log(`${x.status}|${x.stage}`)')
            echo "$STATE"
            STATUS=$(printf '%s' "$STATE" | cut -d'|' -f1)
            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "blocked" ]; then
              cat job.json
              exit 1
            fi
            if [ "$STATUS" = "ready_upscale" ]; then ready=true; break; fi
          done
          test "$ready" = true
          RAW_URL=$(node -e 'const x=require("./job.json"); if(x.status!=="ready_upscale" || !x.result?.raw_asset_url) throw Error(JSON.stringify(x)); process.stdout.write(x.result.raw_asset_url)')
          curl --fail-with-body -sS -D raw.headers -o raw.png "$BASE_URL$RAW_URL"
          grep -qi '^content-type: image/png' raw.headers
          test -s raw.png
          node -e 'const x=require("./job.json"); console.log("raw artifact ready", JSON.stringify({status:x.status,stage:x.stage,raw_asset_url:x.result.raw_asset_url}))'
          echo "GENERATION BOUNDARY E2E PASSED"

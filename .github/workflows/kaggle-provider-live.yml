name: Kaggle Provider Live Test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kaggle-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Validate credential
        run: test -n "$KAGGLE_API_TOKEN"
      - name: Prepare worker payload
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          import base64,hashlib,json,urllib.request
          im=Image.new('RGB',(768,768),'white'); d=ImageDraw.Draw(im)
          d.rectangle((96,96,672,672),outline='black',width=8); d.ellipse((240,180,528,468),outline='black',width=8); d.line((180,570,588,570),fill='black',width=8)
          im.save('source.jpg',format='JPEG',quality=95,subsampling='4:4:4')
          src=open('source.jpg','rb').read(); sha=hashlib.sha256(src).hexdigest()
          req={'schema_version':1,'kind':'stockforge.master_finalizer_request','request_id':'kaggle-provider-live-test','status':'prepared_no_gpu','source':{'relative_path':'source.jpg','sha256':sha,'width':768,'height':768,'format':'JPEG','color_mode':'RGB'},'target':{'mode':'ai_upscale','scale':4,'format':'jpeg','color_space':'sRGB','expected_width':3072,'expected_height':3072,'minimum_megapixels':9},'destination':'masters/kaggle-provider-live-test-master.jpg'}
          worker=urllib.request.urlopen('https://raw.githubusercontent.com/ibank31/stockforge-ai/main/deploy/kaggle-finalizer/worker.py',timeout=30).read().decode()
          enc=lambda b: base64.b64encode(b).decode()
          injected='REQUEST_B64 = '+json.dumps(enc(json.dumps(req,separators=(',',':')).encode()))+'\nSOURCE_NAME = "source.jpg"\nSOURCE_B64 = '+json.dumps(enc(src))+'\n'
          open('kernel.py','w').write(injected+worker)
          PY
      - name: Submit Kaggle GPU kernel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > payload.json
          import json
          s=open('kernel.py',encoding='utf-8').read()
          print(json.dumps({'slug':'iqbalteguh/stockforge-finalizer-live-test','newTitle':'StockForge Finalizer Live Test','text':s,'language':'python','kernelType':'script','isPrivate':True,'enableGpu':True,'enableInternet':True,'machineShape':'NvidiaTeslaT4'}))
          PY
          curl -sS --fail-with-body -H "Authorization: Bearer $KAGGLE_API_TOKEN" -H 'Accept: application/json' -H 'Content-Type: application/json' -X POST 'https://www.kaggle.com/api/v1/kernels/push' --data-binary @payload.json > submit.json
          python - <<'PY'
          import json
          x=json.load(open('submit.json'))
          if x.get('error'): raise SystemExit(f"Kaggle push rejected: {x['error']}")
          ref=x.get('ref') or ''
          parts=[p for p in ref.split('/') if p]
          if len(parts) < 2: raise SystemExit(f'Kaggle push returned invalid ref: {ref!r}')
          owner,slug=parts[-2],parts[-1]
          open('kaggle_ref','w').write(owner+'/'+slug)
          print(json.dumps({'ref':ref,'provider_job_id':owner+'/'+slug,'versionNumber':x.get('versionNumber')},sort_keys=True))
          PY
      - name: Poll Kaggle
        shell: bash
        run: |
          set -euo pipefail
          IFS=/ read -r KAGGLE_OWNER KAGGLE_SLUG < kaggle_ref
          complete=0
          for i in $(seq 1 90); do
            curl -sS --fail-with-body -H "Authorization: Bearer $KAGGLE_API_TOKEN" -H 'Accept: application/json' "https://www.kaggle.com/api/v1/kernels/status?userName=${KAGGLE_OWNER}&kernelSlug=${KAGGLE_SLUG}" > status.json
            if python - <<'PY'
          import json,sys
          x=json.load(open('status.json'))
          s=str(x.get('status') or x.get('state') or x.get('result',{}).get('status') or '').upper()
          print('state=',s)
          if s in {'ERROR','FAILED','FAILURE','CANCELLED','CANCEL_REQUESTED','CANCEL_ACKNOWLEDGED'}:
              print(json.dumps(x)[:4000]); sys.exit(2)
          sys.exit(0 if s == 'COMPLETE' else 1)
          PY
            then complete=1; break; else rc=$?; test "$rc" -eq 1 || exit "$rc"; fi
            sleep 10
          done
          test "$complete" -eq 1
      - name: Download and verify outputs
        shell: bash
        run: |
          set -euo pipefail
          IFS=/ read -r KAGGLE_OWNER KAGGLE_SLUG < kaggle_ref
          curl -sS --fail-with-body -H "Authorization: Bearer $KAGGLE_API_TOKEN" "https://www.kaggle.com/api/v1/kernels/output/download/${KAGGLE_OWNER}/${KAGGLE_SLUG}/result.json" -o result.json
          curl -sS --fail-with-body -H "Authorization: Bearer $KAGGLE_API_TOKEN" "https://www.kaggle.com/api/v1/kernels/output/download/${KAGGLE_OWNER}/${KAGGLE_SLUG}/master.jpg" -o master.jpg
          python - <<'PY'
          from PIL import Image
          import json,os
          r=json.load(open('result.json')); im=Image.open('master.jpg')
          assert r['provider']=='kaggle-realesrgan' and r['model_id']=='RealESRGAN_x4plus' and r['scale']==4
          assert r['master']['width']==3072 and r['master']['height']==3072
          assert im.format=='JPEG' and im.mode=='RGB' and im.size==(3072,3072) and os.path.getsize('master.jpg')>100000
          print('KAGGLE_PROVIDER_LIVE_TEST_PASSED', {'size_bytes':os.path.getsize('master.jpg'),'dimensions':im.size})
          PY

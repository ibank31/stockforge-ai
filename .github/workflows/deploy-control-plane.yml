name: Deploy StockForge control plane

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "deploy/control-plane/**"
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ secrets.HF_TOKEN != '' || secrets.HUGGINGFACE_HUB_TOKEN != '' || secrets.HUGGINGFACE_TOKEN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_HUB_TOKEN || secrets.HUGGINGFACE_TOKEN }}
      HF_SPACE: ibank31/stockforge-control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugging Face Hub client
        run: python -m pip install --disable-pip-version-check --no-cache-dir "huggingface_hub>=0.30,<1.0"

      - name: Create or update control-plane Space
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = os.environ["HF_SPACE"]
          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="docker",
              exist_ok=True,
          )
          api.upload_folder(
              folder_path="deploy/control-plane",
              repo_id=repo_id,
              repo_type="space",
              commit_message="deploy StockForge control plane from main",
          )
          print(f"Control plane deployed to https://huggingface.co/spaces/{repo_id}")
          PY
